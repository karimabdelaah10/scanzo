services:
  app:
    env_file: .env
    build:
      dockerfile: .docker/Dockerfile
      context: .
    volumes:
      - ./core:/var/www
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/php-overrides.ini
    working_dir: /var/www
    container_name: ${APP_CONTAINER_NAME}
    depends_on:
      - mysql
      - redis
    networks:
      - ${NETWORK_NAME}
    restart: unless-stopped

  nginx:
    env_file: .env
    image: nginx:alpine
    container_name: ${MAIN_NGINX_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - ${MAIN_NGINX_PORT}:80
    volumes:
      - ./core:/var/www
      - ./.docker/nginx:/etc/nginx/conf.d
    networks:
      - ${NETWORK_NAME}

  mysql:
    env_file: .env
    image: mysql:8.0
    restart: unless-stopped
    container_name: ${MAIN_DB_CONTAINER_NAME}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MAIN_DB_PORT}:3306"
    volumes:
      - "./.docker-data/dbdata:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: ${MAIN_DB_NAME}
      MYSQL_USER: ${MAIN_DB_USER}
      MYSQL_PASSWORD: ${MAIN_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MAIN_DB_PASSWORD}
    networks:
      - ${NETWORK_NAME}

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-scanzo-redis}
    restart: unless-stopped
    networks:
      - ${NETWORK_NAME}

  mysql_test:
    env_file: .env
    image: mysql:8.0
    restart: unless-stopped
    container_name: ${TEST_DB_CONTAINER_NAME:-scanzo-mysql-test}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${TEST_DB_PORT:-43307}:3306"
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_DATABASE: ${TEST_DB_NAME:-scanzo_testing}
      MYSQL_USER: ${TEST_DB_USER:-scanzo}
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${TEST_DB_PASSWORD:-secret}
    networks:
      - ${NETWORK_NAME}

networks:
  scanzo-network:
    name: ${NETWORK_NAME}
    external: true
    driver: bridge
